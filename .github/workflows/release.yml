name: Release desktop app

# Every change to the app on main becomes a new version: the version number goes up by one patch step,
# the Windows installer is built, and both are published as a GitHub Release. Installed copies look at
# the latest release and update themselves from it.
on:
  push:
    branches: [main]
    paths:
      - app.py
      - build.py
      - src/**
      - web/**
      - desktop/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Raise the version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v$version [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install dependencies
        run: npm ci

      - name: Fetch the bundled Python and build the Java runtime
        shell: pwsh
        run: ./vendor.ps1

      - name: Build and publish the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
