name: Release desktop app

# Every change to the app on main becomes a new version: the version number goes up by one patch step,
# the Windows installer is built and published as a GitHub Release, and the update feed is pointed at it.
# Installed copies read the feed (latest.yml on the update-feed branch) and update themselves from the release.
on:
  push:
    branches: [main]
    paths:
      - app.py
      - build.py
      - src/**
      - web/**
      - desktop/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the release notes list the commits since the previous version's tag

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Raise the version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v$version [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install dependencies
        run: npm ci

      - name: Fetch the bundled Python and build the Java runtime
        shell: pwsh
        run: ./vendor.ps1

      - name: Build the installer
        run: npx electron-builder --win --publish never

      # The release holds only the installer, so there is one obvious file to download.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          notes=$(git log --no-merges --format='- %s' ${previous:+$previous..}HEAD | grep -v '^- Release v' || true)
          gh release create "v$VERSION" dist/*.exe --target "$(git rev-parse HEAD)" --title "Seed Scout $VERSION" --notes "${notes:-Maintenance release.}" --latest

      # The feed is published after the release, so it never names an installer that is not there yet.
      # It lives on its own branch with the installer's full address in it.
      - name: Point the update feed at the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          feed="$RUNNER_TEMP/update-feed"
          mkdir -p "$feed"
          sed -E "s#^(\s*-? ?(url|path)): (Seed-Scout-Setup)#\1: $base/\3#" dist/latest.yml > "$feed/latest.yml"
          cat "$feed/latest.yml"
          grep -q "url: $base/" "$feed/latest.yml"
          cd "$feed"
          git init -q -b update-feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.yml
          git commit -q -m "Seed Scout $VERSION"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" update-feed
